<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100 DAYS TOGETHER</title>
  <style>
    /* ========== CSS VARIABLES ========== */
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-sub: #7f8c8d;
      --primary: #2ecc71; /* 기본값 */
      --primary-hover: #27ae60;
      --border-color: #e2e8f0;
      --shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); transition: background-color 0.3s ease; padding-bottom: 50px; }

    /* ========== HEADER & COLOR PICKER ========== */
    header {
      background: var(--card-bg);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }
    .logo { font-size: 1.1rem; font-weight: bold; letter-spacing: 1px; color: var(--primary); transition: color 0.3s ease; }
    
    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-sub);
    }
    
    .color-picker-wrapper input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }
    
    .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }
    .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
      border: 2px solid var(--border-color);
      border-radius: 50%;
    }

    /* ========== CONTAINER & CARDS ========== */
    main { max-width: 500px; margin: 20px auto; padding: 0 15px; }
    section { background: var(--card-bg); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
    .hidden { display: none !important; }

    h1 { font-size: 1.6rem; margin-bottom: 10px; line-height: 1.3; }
    h2 { font-size: 1.1rem; margin-bottom: 12px; }
    p { color: var(--text-sub); font-size: 0.95rem; margin-bottom: 15px; }

    input[type="text"], textarea {
      width: 100%; padding: 12px; margin-bottom: 10px;
      border: 1px solid var(--border-color); border-radius: 8px;
      background: var(--bg-color); color: var(--text-main); font-size: 0.95rem;
    }

    button {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: var(--primary); color: white; font-weight: bold; font-size: 0.95rem;
      cursor: pointer; transition: background 0.2s ease; margin-top: 5px;
    }
    button:hover { background: var(--primary-hover); }
    button.secondary { background: transparent; color: var(--text-sub); border: 1px solid var(--border-color); }

    /* ========== SPECIFIC COMPONENTS ========== */
    .invite-code-box {
      font-size: 2rem; font-weight: bold; letter-spacing: 4px;
      text-align: center; color: var(--primary); padding: 15px;
      background: var(--bg-color); border-radius: 8px; margin: 15px 0;
      transition: color 0.3s ease;
    }

    .profile-card {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 15px; background: var(--bg-color); border-radius: 8px; margin-bottom: 10px;
    }
    .profile-card .edit-btn { width: auto; padding: 4px 12px; font-size: 0.8rem; margin-top: 0; }

    /* Photo Upload Styling */
    .image-preview { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; display: none; }
    .record-img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 8px; margin-top: 10px; }

    /* Modal styling for editing */
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 100;
    }
    .modal-content { background: var(--card-bg); width: 90%; max-width: 400px; padding: 20px; border-radius: 12px; }
  </style>
</head>
<body>

  <header>
    <div class="logo">100 DAYS TOGETHER</div>
    
    <!-- Custom Color Picker -->
    <div class="color-picker-wrapper">
      <span>테마 색상</span>
      <input type="color" id="primaryColorPicker" value="#2ecc71" oninput="customThemeColor(this.value)">
    </div>
  </header>

  <main>
    <!-- 1. START SECTION -->
    <section id="startSection">
      <p>100일 챌린지</p>
      <h1>함께 100일을<br>달성해봐요.</h1>
      <p>방을 만들거나 친구의 초대코드로 참여하세요.</p>
      
      <button onclick="showSection('createSection')">새로운 방 만들기</button>
      <button class="secondary" onclick="showSection('joinSection')">초대코드로 참여하기</button>
    </section>

    <!-- 2. CREATE ROOM SECTION -->
    <section id="createSection" class="hidden">
      <h1>방 만들기</h1>
      <p>나의 이름과 목표를 설정하세요.</p>
      <input type="text" id="createName" placeholder="이름 (예: 홍길동)">
      <input type="text" id="createGoal" placeholder="목표 (예: 매일 영단어 10개 외우기)">
      <button onclick="handleCreateRoom()">초대코드 생성하기</button>
      <button class="secondary" onclick="showSection('startSection')">취소</button>
    </section>

    <!-- 3. JOIN ROOM SECTION -->
    <section id="joinSection" class="hidden">
      <h1>챌린지 참여하기</h1>
      <p>초대코드를 입력하고 본인의 정보를 설정하세요.</p>
      <input type="text" id="joinCode" placeholder="초대코드 6자리 입력">
      <input type="text" id="joinName" placeholder="내 이름 (예: 김철수)">
      <input type="text" id="joinGoal" placeholder="내 목표 (예: 매일 30분 운동하기)">
      <button onclick="handleJoinRoom()">참여하기</button>
      <button class="secondary" onclick="showSection('startSection')">취소</button>
    </section>

    <!-- 4. INVITE CODE WAITING SECTION -->
    <section id="inviteSection" class="hidden">
      <p>초대코드</p>
      <div class="invite-code-box" id="displayInviteCode">------</div>
      <p>친구에게 이 코드를 알려주세요. 친구가 참여하면 챌린지가 시작됩니다.</p>
      <button onclick="copyInviteCode()">코드 복사하기</button>
      <button class="secondary" onclick="cancelWaiting()">뒤로 가기 (방 대기 취소)</button>
    </section>

    <!-- 5. MAIN DASHBOARD SECTION -->
    <section id="dashboardSection" class="hidden">
      <div>
        <p>TOGETHER</p>
        <h1>DAY <span id="currentDay">1</span> / 100</h1>
      </div>

      <!-- 프로필 영역 -->
      <div style="margin: 15px 0;">
        <div class="profile-card">
          <div>
            <strong id="myProfileName">나</strong>: <span id="myProfileGoal">목표</span>
          </div>
          <button class="edit-btn" onclick="openEditModal()">수정</button>
        </div>
        <div class="profile-card">
          <div>
            <strong id="partnerProfileName">상대방</strong>: <span id="partnerProfileGoal">목표</span>
          </div>
        </div>
      </div>

      <!-- 오늘의 기록 작성 -->
      <section style="padding: 15px; margin-top: 15px;">
        <h2>오늘의 기록 작성</h2>
        <textarea id="recordText" rows="3" placeholder="오늘 목표를 달성하셨나요? 소감을 남겨주세요."></textarea>
        
        <input type="file" id="recordImageInput" accept="image/*" onchange="previewImage(event)">
        <img id="imagePreview" class="image-preview" alt="미리보기">

        <button onclick="saveRecord()">오늘의 인증 완료하기</button>
      </section>

      <!-- 기록 목록 -->
      <section style="padding: 15px; margin-top: 15px;">
        <h2>오늘의 기록 목록</h2>
        <div id="recordsList">등록된 기록이 없습니다.</div>
      </section>
    </section>

    <!-- EDIT PROFILE MODAL -->
    <div id="editModal" class="modal hidden">
      <div class="modal-content">
        <h2>프로필 수정</h2>
        <p style="margin-bottom:10px;">이름과 목표를 변경할 수 있습니다.</p>
        <input type="text" id="editName" placeholder="새로운 이름">
        <input type="text" id="editGoal" placeholder="새로운 목표">
        <button onclick="saveProfileEdit()">저장</button>
        <button class="secondary" onclick="closeEditModal()">취소</button>
      </div>
    </div>
  </main>

  <script>
    // State management
    let state = {
      roomCode: null,
      myInfo: { name: '', goal: '' },
      partnerInfo: { name: '상대방', goal: '대기 중...' },
      records: []
    };

    // 1. CUSTOM COLOR PICKER FUNCTION
    function customThemeColor(hexColor) {
      document.documentElement.style.setProperty('--primary', hexColor);
      
      const hoverColor = adjustColorBrightness(hexColor, -20);
      document.documentElement.style.setProperty('--primary-hover', hoverColor);

      localStorage.setItem('customPrimaryColor', hexColor);
    }

    function adjustColorBrightness(hex, percent) {
      let num = parseInt(hex.replace('#',''), 16),
      amt = Math.round(2.55 * percent),
      R = (num >> 16) + amt,
      G = (num >> 8 & 0x00FF) + amt,
      B = (num & 0x0000FF) + amt;
      return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (G<255?G<1?0:G:255)*0x100 + (B<255?B<1?0:B:255)).toString(16).slice(1);
    }

    function loadSavedColor() {
      const savedColor = localStorage.getItem('customPrimaryColor');
      if (savedColor) {
        document.getElementById('primaryColorPicker').value = savedColor;
        customThemeColor(savedColor);
      }
    }

    // UI SECTION TOGGLE
    function showSection(sectionId, pushHistory = true) {
      const sections = ['startSection', 'createSection', 'joinSection', 'inviteSection', 'dashboardSection'];
      sections.forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });
      document.getElementById(sectionId).classList.remove('hidden');

      if (pushHistory) {
        history.pushState({ section: sectionId }, '', `#${sectionId}`);
      }
    }

    // 뒤로가기 처리
    window.onpopstate = function(event) {
      if (event.state && event.state.section) {
        showSection(event.state.section, false);
      } else {
        showSection('startSection', false);
      }
    };

    // CREATE ROOM
    function handleCreateRoom() {
      const name = document.getElementById('createName').value.trim();
      const goal = document.getElementById('createGoal').value.trim();

      if (!name || !goal) return alert('이름과 목표를 모두 입력해주세요.');

      state.myInfo = { name, goal };
      state.roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();

      document.getElementById('displayInviteCode').innerText = state.roomCode;
      showSection('inviteSection');
    }

    function cancelWaiting() {
      if (confirm('방 생성을 취소하고 처음으로 돌아가시겠습니까?')) {
        showSection('startSection');
      }
    }

    function copyInviteCode() {
      navigator.clipboard.writeText(state.roomCode);
      alert('초대코드가 복사되었습니다: ' + state.roomCode);
      
      setTimeout(() => {
        if(confirm('테스트: 상대방이 입장했다고 가정하고 챌린지를 시작할까요?')) {
          showSection('dashboardSection');
          updateDashboard();
        }
      }, 500);
    }

    // JOIN ROOM
    function handleJoinRoom() {
      const code = document.getElementById('joinCode').value.trim();
      const name = document.getElementById('joinName').value.trim();
      const goal = document.getElementById('joinGoal').value.trim();

      if (!code || !name || !goal) {
        return alert('초대코드, 이름, 목표를 모두 입력해주세요.');
      }

      state.roomCode = code;
      state.myInfo = { name, goal };
      state.partnerInfo = { name: '방장', goal: '100일 완주하기' };

      showSection('dashboardSection');
      updateDashboard();
    }

    // PHOTO PREVIEW & RECORD SAVING
    let currentImageBase64 = null;

    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentImageBase64 = e.target.result;
          const imgEl = document.getElementById('imagePreview');
          imgEl.src = currentImageBase64;
          imgEl.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    }

    function saveRecord() {
      const text = document.getElementById('recordText').value.trim();
      if (!text && !currentImageBase64) return alert('내용 또는 인증 사진을 입력해주세요.');

      const newRecord = {
        author: state.myInfo.name,
        text: text,
        image: currentImageBase64,
        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      state.records.unshift(newRecord);

      document.getElementById('recordText').value = '';
      document.getElementById('recordImageInput').value = '';
      document.getElementById('imagePreview').style.display = 'none';
      currentImageBase64 = null;

      renderRecords();
    }

    function renderRecords() {
      const listContainer = document.getElementById('recordsList');
      if (state.records.length === 0) {
        listContainer.innerHTML = '등록된 기록이 없습니다.';
        return;
      }

      listContainer.innerHTML = state.records.map(rec => `
        <div style="background: var(--bg-color); padding: 12px; border-radius: 8px; margin-top: 10px;">
          <div style="display:flex; justify-content:space-between; font-size:0.85rem; color:var(--text-sub);">
            <strong>${rec.author}</strong>
            <span>${rec.date}</span>
          </div>
          ${rec.text ? `<p style="margin: 8px 0 0 0; color:var(--text-main);">${rec.text}</p>` : ''}
          ${rec.image ? `<img src="${rec.image}" class="record-img">` : ''}
        </div>
      `).join('');
    }

    // PROFILE EDIT
    function updateDashboard() {
      document.getElementById('myProfileName').innerText = state.myInfo.name;
      document.getElementById('myProfileGoal').innerText = state.myInfo.goal;
      document.getElementById('partnerProfileName').innerText = state.partnerInfo.name;
      document.getElementById('partnerProfileGoal').innerText = state.partnerInfo.goal;
      renderRecords();
    }

    function openEditModal() {
      document.getElementById('editName').value = state.myInfo.name;
      document.getElementById('editGoal').value = state.myInfo.goal;
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    function saveProfileEdit() {
      const newName = document.getElementById('editName').value.trim();
      const newGoal = document.getElementById('editGoal').value.trim();

      if (!newName || !newGoal) return alert('이름과 목표를 모두 입력해 주세요.');

      state.myInfo.name = newName;
      state.myInfo.goal = newGoal;

      updateDashboard();
      closeEditModal();
      alert('프로필이 수정되었습니다.');
    }

    // 초기화
    window.onload = function() {
      loadSavedColor();
      showSection('startSection', false);
    };
  </script>
</body>
</html>

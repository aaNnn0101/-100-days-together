<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>100 DAYS TOGETHER</title>
  <style>
    /* ========== CSS VARIABLES ========== */
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-main: #2c3e50;
      --text-sub: #7f8c8d;
      --primary: #2ecc71;
      --primary-hover: #27ae60;
      --primary-light: #abebc6;
      --border-color: #e2e8f0;
      --shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); transition: background-color 0.3s ease; padding-bottom: 50px; }

    /* ========== HEADER & COLOR PICKER ========== */
    header {
      background: var(--card-bg);
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow);
    }
    .logo { font-size: 1.1rem; font-weight: bold; letter-spacing: 1px; color: var(--primary); transition: color 0.3s ease; }
    
    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-sub);
    }
    
    .color-picker-wrapper input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }
    
    .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
      border: 2px solid var(--border-color);
      border-radius: 50%;
    }

    /* ========== CONTAINER & CARDS ========== */
    main { max-width: 500px; margin: 20px auto; padding: 0 15px; }
    section { background: var(--card-bg); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
    .hidden { display: none !important; }

    h1 { font-size: 1.6rem; margin-bottom: 10px; line-height: 1.3; }
    h2 { font-size: 1.1rem; margin-bottom: 12px; }
    p { color: var(--text-sub); font-size: 0.95rem; margin-bottom: 15px; }

    input[type="text"], textarea {
      width: 100%; padding: 12px; margin-bottom: 10px;
      border: 1px solid var(--border-color); border-radius: 8px;
      background: var(--bg-color); color: var(--text-main); font-size: 0.95rem;
    }

    button {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: var(--primary); color: white; font-weight: bold; font-size: 0.95rem;
      cursor: pointer; transition: background 0.2s ease; margin-top: 5px;
    }
    button:hover { background: var(--primary-hover); }
    button.secondary { background: transparent; color: var(--text-sub); border: 1px solid var(--border-color); }

    .invite-code-box {
      font-size: 2rem; font-weight: bold; letter-spacing: 4px;
      text-align: center; color: var(--primary); padding: 15px;
      background: var(--bg-color); border-radius: 8px; margin: 15px 0;
      transition: color 0.3s ease;
    }

    .profile-card {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 15px; background: var(--bg-color); border-radius: 8px; margin-bottom: 10px;
    }

    /* CALENDAR STYLES */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
      margin-top: 10px;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 5px;
    }
    .day-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: bold;
      border-radius: 6px;
      background: var(--bg-color);
      color: var(--text-sub);
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    .day-cell:hover { border-color: var(--primary); }
    .day-cell.today { border: 2px solid var(--primary); }
    .day-cell.partial { background: var(--primary-light); color: var(--text-main); }
    .day-cell.complete { background: var(--primary); color: white; }
    .day-cell.selected { ring: 2px solid var(--text-main); transform: scale(1.05); }

    .calendar-legend {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      font-size: 0.75rem;
      color: var(--text-sub);
      margin-top: 10px;
    }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-box { width: 12px; height: 12px; border-radius: 3px; }

    .image-preview { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; display: none; }
    .record-img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 8px; margin-top: 10px; }
  </style>

  <!-- Firebase SDK 모듈 로드 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc, arrayUnion 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // -------------------------------------------------------------
    // Firebase 설정 (본인의 키 값으로 세팅해 주세요)
    // -------------------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyA6-kgw6HncPlex2ENNIu2N1EObEwPcSZ0",
      authDomain: "days-66f4e.firebaseapp.com",
      projectId: "days-66f4e",
      storageBucket: "days-66f4e.firebasestorage.app",
      messagingSenderId: "197221374574",
      appId: "1:197221374574:web:4c4300f0979113b587a47f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 전역 상태 변수
    window.appState = {
      roomCode: null,
      role: null,
      myInfo: { name: '', goal: '' },
      partnerInfo: { name: '상대방', goal: '대기 중...' },
      createdAt: null,
      records: [],
      selectedDay: null // 필터링용 날짜 선택값
    };

    let unsubscribeRoom = null;

    // -------------------------------------------------------------
    // 1. 세션 저장 및 복원
    // -------------------------------------------------------------
    function saveSession() {
      localStorage.setItem('challenge_session', JSON.stringify(window.appState));
    }

    function loadSession() {
      const saved = localStorage.getItem('challenge_session');
      if (saved) {
        try {
          window.appState = JSON.parse(saved);
          if (window.appState.roomCode) {
            const codeBox = document.getElementById('displayInviteCode');
            if (codeBox) codeBox.innerText = window.appState.roomCode;
            listenToRoom(window.appState.roomCode);
          }
        } catch(e) {
          console.error("세션 복원 실패", e);
        }
      }
    }

    window.resetSession = function() {
      localStorage.removeItem('challenge_session');
      if (unsubscribeRoom) unsubscribeRoom();
      window.appState = {
        roomCode: null, role: null,
        myInfo: { name: '', goal: '' },
        partnerInfo: { name: '상대방', goal: '대기 중...' },
        createdAt: null, records: [], selectedDay: null
      };
      const codeBox = document.getElementById('displayInviteCode');
      if (codeBox) codeBox.innerText = "------";
      showSection('startSection');
    };

    // -------------------------------------------------------------
    // 2. FIRESTORE 실시간 동기화
    // -------------------------------------------------------------
    function listenToRoom(roomCode) {
      if (unsubscribeRoom) unsubscribeRoom();

      const roomRef = doc(db, "rooms", roomCode);
      unsubscribeRoom = onSnapshot(roomRef, (snapshot) => {
        if (!snapshot.exists()) {
          alert('존재하지 않거나 삭제된 방입니다.');
          window.resetSession();
          return;
        }

        const data = snapshot.data();
        const role = window.appState.role;

        const codeBox = document.getElementById('displayInviteCode');
        if (codeBox && roomCode) codeBox.innerText = roomCode;

        window.appState.createdAt = data.createdAt || new Date().toISOString();

        if (role === 'creator') {
          window.appState.myInfo = data.creator || { name: '', goal: '' };
          if (data.joiner) {
            window.appState.partnerInfo = data.joiner;
            showSection('dashboardSection');
          } else {
            window.appState.partnerInfo = { name: '상대방', goal: '대기 중...' };
            showSection('inviteSection');
          }
        } else if (role === 'joiner') {
          window.appState.myInfo = data.joiner || { name: '', goal: '' };
          window.appState.partnerInfo = data.creator || { name: '방장', goal: '' };
          showSection('dashboardSection');
        }

        window.appState.records = data.records || [];
        updateDashboard();
        saveSession();
      });
    }

    // -------------------------------------------------------------
    // 3. 방 만들기
    // -------------------------------------------------------------
    window.handleCreateRoom = async function(e) {
      if (e) e.preventDefault();
      
      const name = document.getElementById('createName').value.trim();
      const goal = document.getElementById('createGoal').value.trim();
      if (!name || !goal) return alert('이름과 목표를 입력해주세요.');

      const roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
      const createdAt = new Date().toISOString();

      window.appState.roomCode = roomCode;
      window.appState.role = 'creator';
      window.appState.myInfo = { name, goal };
      window.appState.createdAt = createdAt;

      document.getElementById('displayInviteCode').innerText = roomCode;

      try {
        await setDoc(doc(db, "rooms", roomCode), {
          roomCode: roomCode,
          createdAt: createdAt,
          creator: { name, goal },
          joiner: null,
          records: []
        });

        saveSession();
        listenToRoom(roomCode);
        showSection('inviteSection');
      } catch (err) {
        alert("방 생성 실패: " + err.message);
      }
    };

    // -------------------------------------------------------------
    // 4. 방 참여하기
    // -------------------------------------------------------------
    window.handleJoinRoom = async function(e) {
      if (e) e.preventDefault();

      const code = document.getElementById('joinCode').value.trim().toUpperCase();
      const name = document.getElementById('joinName').value.trim();
      const goal = document.getElementById('joinGoal').value.trim();

      if (!code || !name || !goal) return alert('모든 항목을 입력해주세요.');

      const roomRef = doc(db, "rooms", code);
      const roomSnap = await getDoc(roomRef);

      if (!roomSnap.exists()) {
        return alert('유효하지 않은 초대코드입니다. 코드를 다시 확인해주세요.');
      }

      window.appState.roomCode = code;
      window.appState.role = 'joiner';
      window.appState.myInfo = { name, goal };

      try {
        await updateDoc(roomRef, {
          joiner: { name, goal }
        });

        saveSession();
        listenToRoom(code);
      } catch (err) {
        alert("방 참여 실패: " + err.message);
      }
    };

    // -------------------------------------------------------------
    // 5. 인증 기록 저장
    // -------------------------------------------------------------
    window.saveRecord = async function(e) {
      if (e) e.preventDefault();

      const text = document.getElementById('recordText').value.trim();
      if (!text && !window.currentImageBase64) return alert('내용이나 사진을 첨부해주세요.');

      const currentDay = getCurrentDayNumber();

      const newRecord = {
        author: window.appState.myInfo.name,
        text: text,
        image: window.currentImageBase64 || null,
        day: currentDay,
        timestamp: new Date().toISOString(),
        date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      try {
        const roomRef = doc(db, "rooms", window.appState.roomCode);
        await updateDoc(roomRef, {
          records: arrayUnion(newRecord)
        });

        document.getElementById('recordText').value = '';
        document.getElementById('recordImageInput').value = '';
        document.getElementById('imagePreview').style.display = 'none';
        window.currentImageBase64 = null;
      } catch (err) {
        alert("기록 저장 실패: " + err.message);
      }
    };

    // 날짜 및 Day 계산 도우미
    function getCurrentDayNumber() {
      if (!window.appState.createdAt) return 1;
      const start = new Date(window.appState.createdAt);
      const now = new Date();
      start.setHours(0, 0, 0, 0);
      now.setHours(0, 0, 0, 0);
      const diffTime = Math.abs(now - start);
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
      return diffDays > 100 ? 100 : diffDays;
    }

    // UI Helper 함수
    window.showSection = function(sectionId) {
      const sections = ['startSection', 'createSection', 'joinSection', 'inviteSection', 'dashboardSection'];
      sections.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.add('hidden');
      });
      const target = document.getElementById(sectionId);
      if (target) target.classList.remove('hidden');
    };

    window.updateDashboard = function() {
      const currentDay = getCurrentDayNumber();
      document.getElementById('currentDay').innerText = currentDay;
      document.getElementById('myProfileName').innerText = window.appState.myInfo.name || '나';
      document.getElementById('myProfileGoal').innerText = window.appState.myInfo.goal || '목표';
      document.getElementById('partnerProfileName').innerText = window.appState.partnerInfo.name || '상대방';
      document.getElementById('partnerProfileGoal').innerText = window.appState.partnerInfo.goal || '대기 중...';
      
      renderCalendar(currentDay);
      renderRecords();
    };

    // 달력 렌더링 함수
    function renderCalendar(currentDay) {
      const calendarEl = document.getElementById('calendarGrid');
      if (!calendarEl) return;

      const records = window.appState.records || [];
      const dayStats = {};

      // 일차별 각 사용자별 달성 여부 집계
      records.forEach(rec => {
        const d = rec.day || 1;
        if (!dayStats[d]) dayStats[d] = new Set();
        dayStats[d].add(rec.author);
      });

      let html = '';
      for (let i = 1; i <= 100; i++) {
        const authors = dayStats[i] ? dayStats[i].size : 0;
        let statusClass = '';
        
        if (authors >= 2) {
          statusClass = 'complete'; // 2명 모두 완료
        } else if (authors === 1) {
          statusClass = 'partial';  // 1명 완료
        }

        if (i === currentDay) statusClass += ' today';
        if (window.appState.selectedDay === i) statusClass += ' selected';

        html += `<div class="day-cell ${statusClass}" onclick="filterByDay(${i})">${i}</div>`;
      }
      calendarEl.innerHTML = html;
    }

    window.filterByDay = function(day) {
      if (window.appState.selectedDay === day) {
        window.appState.selectedDay = null; // 필터 해제
      } else {
        window.appState.selectedDay = day;
      }
      renderCalendar(getCurrentDayNumber());
      renderRecords();
    };

    window.clearDayFilter = function() {
      window.appState.selectedDay = null;
      renderCalendar(getCurrentDayNumber());
      renderRecords();
    };

    function renderRecords() {
      const listContainer = document.getElementById('recordsList');
      const filterTitle = document.getElementById('filterTitle');
      let records = window.appState.records || [];

      if (window.appState.selectedDay) {
        records = records.filter(r => r.day === window.appState.selectedDay);
        filterTitle.innerText = `DAY ${window.appState.selectedDay} 기록 (${records.length}개)`;
        document.getElementById('clearFilterBtn').classList.remove('hidden');
      } else {
        filterTitle.innerText = '전체 기록 목록';
        document.getElementById('clearFilterBtn').classList.add('hidden');
      }

      if (records.length === 0) {
        listContainer.innerHTML = '<div style="color:var(--text-sub); font-size:0.9rem; padding: 10px 0;">등록된 기록이 없습니다.</div>';
        return;
      }

      listContainer.innerHTML = records.slice().reverse().map(rec => `
        <div style="background: var(--bg-color); padding: 12px; border-radius: 8px; margin-top: 10px;">
          <div style="display:flex; justify-content:space-between; font-size:0.85rem; color:var(--text-sub);">
            <strong>${rec.author} <span style="font-weight:normal; color:var(--primary);">(DAY ${rec.day || 1})</span></strong>
            <span>${rec.date}</span>
          </div>
          ${rec.text ? `<p style="margin: 8px 0 0 0; color:var(--text-main);">${rec.text}</p>` : ''}
          ${rec.image ? `<img src="${rec.image}" class="record-img">` : ''}
        </div>
      `).join('');
    }

    // 초기 실행
    window.addEventListener('DOMContentLoaded', () => {
      loadSavedColor();
      loadSession();
      if (!window.appState.roomCode) {
        showSection('startSection');
      }
    });
  </script>
</head>
<body>

  <header>
    <div class="logo">100 DAYS TOGETHER</div>
    <div class="color-picker-wrapper">
      <span>테마 색상</span>
      <input type="color" id="primaryColorPicker" value="#2ecc71" oninput="customThemeColor(this.value)">
    </div>
  </header>

  <main>
    <!-- 1. START SECTION -->
    <section id="startSection">
      <p>100일 챌린지</p>
      <h1>함께 100일을<br>달성해봐요.</h1>
      <p>방을 만들거나 친구의 초대코드로 참여하세요.</p>
      
      <button type="button" onclick="showSection('createSection')">새로운 방 만들기</button>
      <button type="button" class="secondary" onclick="showSection('joinSection')">초대코드로 참여하기</button>
    </section>

    <!-- 2. CREATE ROOM SECTION -->
    <section id="createSection" class="hidden">
      <h1>방 만들기</h1>
      <p>나의 이름과 목표를 설정하세요.</p>
      <form onsubmit="handleCreateRoom(event)">
        <input type="text" id="createName" placeholder="이름 (예: 홍길동)">
        <input type="text" id="createGoal" placeholder="목표 (예: 매일 영단어 10개 외우기)">
        <button type="submit">초대코드 생성하기</button>
        <button type="button" class="secondary" onclick="showSection('startSection')">취소</button>
      </form>
    </section>

    <!-- 3. JOIN ROOM SECTION -->
    <section id="joinSection" class="hidden">
      <h1>챌린지 참여하기</h1>
      <p>초대코드를 입력하고 본인의 정보를 설정하세요.</p>
      <form onsubmit="handleJoinRoom(event)">
        <input type="text" id="joinCode" placeholder="초대코드 입력">
        <input type="text" id="joinName" placeholder="내 이름 (예: 김철수)">
        <input type="text" id="joinGoal" placeholder="내 목표 (예: 매일 30분 운동하기)">
        <button type="submit">참여하기</button>
        <button type="button" class="secondary" onclick="showSection('startSection')">취소</button>
      </form>
    </section>

    <!-- 4. INVITE CODE WAITING SECTION -->
    <section id="inviteSection" class="hidden">
      <p>초대코드</p>
      <div class="invite-code-box" id="displayInviteCode">------</div>
      <p>친구에게 이 코드를 알려주세요. 친구가 참여하면 화면이 자동으로 전환됩니다.</p>
      <button type="button" onclick="copyInviteCode()">코드 복사하기</button>
      <button type="button" class="secondary" onclick="resetSession()">방 삭제 및 처음으로</button>
    </section>

    <!-- 5. MAIN DASHBOARD SECTION -->
    <section id="dashboardSection" class="hidden">
      <div>
        <p>TOGETHER</p>
        <h1>DAY <span id="currentDay">1</span> / 100</h1>
      </div>

      <div style="margin: 15px 0;">
        <div class="profile-card">
          <div>
            <strong id="myProfileName">나</strong>: <span id="myProfileGoal">목표</span>
          </div>
        </div>
        <div class="profile-card">
          <div>
            <strong id="partnerProfileName">상대방</strong>: <span id="partnerProfileGoal">목표</span>
          </div>
        </div>
      </div>

      <!-- 100일 달력 영역 -->
      <section style="padding: 15px; margin-top: 15px;">
        <h2>100일 달성 현황</h2>
        <div class="calendar-grid" id="calendarGrid"></div>
        <div class="calendar-legend">
          <div class="legend-item"><div class="legend-box" style="background:var(--primary-light)"></div>1명 완료</div>
          <div class="legend-item"><div class="legend-box" style="background:var(--primary)"></div>2명 완료</div>
        </div>
      </section>

      <!-- 오늘의 기록 작성 -->
      <section style="padding: 15px; margin-top: 15px;">
        <h2>오늘의 기록 작성</h2>
        <form onsubmit="saveRecord(event)">
          <textarea id="recordText" rows="3" placeholder="오늘 목표를 달성하셨나요? 소감을 남겨주세요."></textarea>
          <input type="file" id="recordImageInput" accept="image/*" onchange="previewImage(event)">
          <img id="imagePreview" class="image-preview" alt="미리보기">
          <button type="submit">오늘의 인증 완료하기</button>
        </form>
      </section>

      <!-- 기록 목록 -->
      <section style="padding: 15px; margin-top: 15px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h2 id="filterTitle">전체 기록 목록</h2>
          <button type="button" id="clearFilterBtn" class="secondary hidden" onclick="clearDayFilter()" style="width:auto; padding:4px 10px; font-size:0.8rem; margin:0;">전체 보기</button>
        </div>
        <div id="recordsList">등록된 기록이 없습니다.</div>
      </section>

      <button type="button" class="secondary" onclick="resetSession()" style="margin-top:20px;">나가기 / 초기화</button>
    </section>
  </main>

  <script>
    window.currentImageBase64 = null;

    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          window.currentImageBase64 = e.target.result;
          const imgEl = document.getElementById('imagePreview');
          imgEl.src = window.currentImageBase64;
          imgEl.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    }

    function copyInviteCode() {
      const code = document.getElementById('displayInviteCode').innerText;
      if (!code || code === '------') return alert('생성된 코드가 없습니다.');
      navigator.clipboard.writeText(code);
      alert('초대코드가 복사되었습니다: ' + code);
    }

    function customThemeColor(hexColor) {
      document.documentElement.style.setProperty('--primary', hexColor);
      const hoverColor = adjustColorBrightness(hexColor, -20);
      const lightColor = adjustColorBrightness(hexColor, 60);
      document.documentElement.style.setProperty('--primary-hover', hoverColor);
      document.documentElement.style.setProperty('--primary-light', lightColor);
      localStorage.setItem('customPrimaryColor', hexColor);
    }

    function adjustColorBrightness(hex, percent) {
      let num = parseInt(hex.replace('#',''), 16),
      amt = Math.round(2.55 * percent),
      R = (num >> 16) + amt,
      G = (num >> 8 & 0x00FF) + amt,
      B = (num & 0x0000FF) + amt;
      return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (G<255?G<1?0:G:255)*0x100 + (B<255?B<1?0:B:255)).toString(16).slice(1);
    }

    function loadSavedColor() {
      const savedColor = localStorage.getItem('customPrimaryColor');
      if (savedColor) {
        document.getElementById('primaryColorPicker').value = savedColor;
        customThemeColor(savedColor);
      }
    }
  </script>
</body>
</html>
